# RefTech Technology Company - CONFIDENTIAL.
# nginx site for RefTech: serves the portal and forwards /api to reftech_core on the same server.
# Install:
#   sudo cp deploy/nginx/reftech.conf /etc/nginx/conf.d/reftech.conf      (or sites-available + symlink)
#   edit server_name and the certificate paths, then: sudo nginx -t && sudo systemctl reload nginx
# Portal and API share one address (https://erp.yourdomain.com), so the browser makes no cross-origin calls.
# Build the portal with VITE_API_URL=https://erp.yourdomain.com (the same address).

upstream reftech_core {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name erp.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                    # nginx older than 1.25.1: remove this line and use `listen 443 ssl http2;`
    server_name erp.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/erp.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.yourdomain.com/privkey.pem;

    access_log /opt/reftech/portal/logs/access.log;
    error_log  /opt/reftech/portal/logs/error.log warn;

    # Largest upload (photos, proofs of delivery, documents; reftech_core allows up to 25 MB files).
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API: reftech_core ---
    location /api/ {
        proxy_pass http://reftech_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;     # long exports and reports
    }

    # --- Portal: the current release ---
    root /opt/reftech/portal/current;
    index index.html;

    # Built files carry a hash in their name, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker and index.html must always be fresh, or users keep an old release.
    location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Single-page app: every other path (/login, /dashboard, /trips/12 ...) returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
